name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: software-mansion/setup-scarb@v1.6.2
      - uses: foundry-rs/setup-snfoundry@v6.0.0
      - run: cargo test --release

  check:
    name: Check formatting, linter, docs and unused dependencies
    runs-on: ubuntu-latest
    env:
      # Make sure CI fails on all warnings - including Clippy lints.
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - run: cargo lint
      - run: cargo doc --workspace --all-features --no-deps
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-machete
      - run: cargo machete

  typos:
    name: Check typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: typos-action
        uses: crate-ci/typos@v1.51.1
